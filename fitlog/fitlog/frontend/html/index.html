<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edzésnapló</title>
<style>
:root{--bg:#f1f4f1;--surface:#fff;--ink:#16212b;--muted:#5b6873;--line:#d5dcd7;--accent:#0e7c66;--on-accent:#fff;--danger:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#11171c;--surface:#192027;--ink:#e8eef1;--muted:#98a6b0;--line:#2b363e;--accent:#3cc2a5;--on-accent:#0b1a16;--danger:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:clamp(1rem,4vw,2.5rem)}
header{display:flex;flex-wrap:wrap;gap:1.5rem 3rem;align-items:flex-end;justify-content:space-between;padding-bottom:1.5rem;border-bottom:2px solid var(--ink)}
h1{margin:0;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;letter-spacing:-.03em;font-weight:800}
#today{margin:.5rem 0 0;color:var(--muted)}
.week{display:flex;gap:.5rem;height:96px;flex:0 1 320px;min-width:240px}
.day{flex:1;display:flex;flex-direction:column;min-width:0}
.track{flex:1;display:flex;align-items:flex-end}
.bar{width:100%;min-height:3px;background:var(--accent);border-radius:2px 2px 0 0}
.bar.zero{background:var(--line)}
.day span{padding-top:.25rem;font-size:.75rem;color:var(--muted);text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem 0;margin:0;padding:1.25rem 0;border-bottom:1px solid var(--line)}
.stats div{padding:0 1rem;border-left:1px solid var(--line)}
.stats div:first-child{padding-left:0;border-left:0}
.stats dt{font-size:.85rem;color:var(--muted)}
.stats dd{margin:0;font-size:1.75rem;font-weight:700}
.layout{display:grid;gap:2rem;grid-template-columns:minmax(0,300px) minmax(0,1fr);align-items:start;padding-top:1.75rem}
form{position:sticky;top:1rem;padding:1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:8px}
h2{margin:0 0 .5rem;font-size:1.1rem}
label{display:block;margin:.85rem 0 .25rem;font-size:.875rem;font-weight:600}
input,textarea{width:100%;padding:.55rem .65rem;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px}
textarea{min-height:3.5rem;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.primary{width:100%;margin-top:1.25rem;padding:.7rem;font:inherit;font-weight:700;color:var(--on-accent);background:var(--accent);border:0;border-radius:6px;cursor:pointer}
.primary:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4rem;margin:.75rem 0 0;font-size:.9rem}
#msg.err{color:var(--danger)}
.date{margin:1.75rem 0 .25rem;font-size:.95rem}
#log>.date:first-child{margin-top:0}
.entry{display:grid;grid-template-columns:minmax(0,1fr) 5rem 5rem 5.5rem auto;gap:.5rem 1rem;align-items:baseline;padding:.65rem 0;border-bottom:1px solid var(--line)}
.entry small{display:block;color:var(--muted)}
.num{text-align:right}
.linkbtn{padding:.25rem;font:inherit;font-size:.85rem;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:var(--danger)}
.empty{color:var(--muted)}
footer{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
@media(max-width:820px){.layout{grid-template-columns:1fr}form{position:static}}
@media(max-width:560px){.entry{grid-template-columns:1fr 1fr 1fr auto}.entry>:first-child{grid-column:1/-1}.num{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Edzésnapló</h1><p id="today"></p></div>
    <div class="week" id="week" role="img" aria-label="Bejegyzések az elmúlt 7 napban"></div>
  </header>

  <dl class="stats">
    <div><dt>Bejegyzés az elmúlt 7 napban</dt><dd id="s7">0</dd></div>
    <div><dt>Összes bejegyzés</dt><dd id="sAll">0</dd></div>
    <div><dt>Összes terhelés</dt><dd><span id="sVol">0</span> kg</dd></div>
    <div><dt>Edzésidő összesen</dt><dd><span id="sMin">0</span> perc</dd></div>
  </dl>

  <div class="layout">
    <form id="f">
      <h2>Új edzés rögzítése</h2>
      <label for="performed_on">Dátum</label>
      <input id="performed_on" type="date" required>
      <label for="exercise">Gyakorlat</label>
      <input id="exercise" list="ex" maxlength="100" autocomplete="off" required>
      <datalist id="ex"><option value="Fekvőtámasz"><option value="Guggolás"><option value="Felhúzás"><option value="Húzódzkodás"><option value="Vállból nyomás"><option value="Evezés"><option value="Futás"><option value="Kerékpározás"></datalist>
      <div class="row">
        <div><label for="sets">Sorozat</label><input id="sets" type="number" min="1" value="3"></div>
        <div><label for="reps">Ismétlés</label><input id="reps" type="number" min="1" value="10"></div>
      </div>
      <div class="row">
        <div><label for="weight_kg">Súly (kg)</label><input id="weight_kg" type="number" min="0" step="0.5" value="0"></div>
        <div><label for="duration_min">Idő (perc)</label><input id="duration_min" type="number" min="0" value="0"></div>
      </div>
      <label for="notes">Megjegyzés</label>
      <textarea id="notes" maxlength="500"></textarea>
      <button class="primary" id="save">Edzés mentése</button>
      <p id="msg" role="status"></p>
    </form>
    <section id="log" aria-label="Naplóbejegyzések"></section>
  </div>

  <footer>
    <span>Kiszolgáló task: <b id="host">–</b></span>
    <span>Adatbázis: <b id="dbst">–</b></span>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.toLocaleDateString('sv-SE');           // helyi dátum ÉÉÉÉ-HH-NN formában
const nf = n => Number(n).toLocaleString('hu-HU');
const say = (t, err) => { const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; };

async function api(path, opts) {
  const r = await fetch('/api/' + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.error || 'A kiszolgáló nem válaszolt (' + r.status + '). Próbáld újra.');
  return b;
}

function render(list, st, info) {
  $('#today').textContent = new Date().toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d; });
  const cnt = days.map(d => list.filter(w => w.performed_on === iso(d)).length);
  const max = Math.max(1, ...cnt);
  $('#week').innerHTML = days.map((d, i) =>
    `<div class="day"><div class="track"><div class="bar${cnt[i] ? '' : ' zero'}" style="height:${cnt[i] / max * 100}%" title="${cnt[i]} bejegyzés"></div></div><span>${d.toLocaleDateString('hu-HU', { weekday: 'short' })}</span></div>`).join('');

  $('#s7').textContent = nf(st.last7_days);
  $('#sAll').textContent = nf(st.total_workouts);
  $('#sVol').textContent = nf(Math.round(st.total_volume_kg));
  $('#sMin').textContent = nf(st.total_minutes);
  $('#host').textContent = info.host;
  $('#dbst').textContent = info.db ? 'elérhető' : 'nem elérhető';

  if (!list.length) {
    $('#log').innerHTML = '<p class="empty">Még nincs bejegyzés. Rögzítsd az első edzést az űrlapon.</p>';
    return;
  }
  let html = '', cur = '';
  for (const w of list) {
    if (w.performed_on !== cur) {
      cur = w.performed_on;
      html += `<h3 class="date">${new Date(cur + 'T00:00').toLocaleDateString('hu-HU', { weekday: 'long', month: 'long', day: 'numeric' })}</h3>`;
    }
    html += `<div class="entry"><div><b>${esc(w.exercise)}</b>${w.notes ? `<small>${esc(w.notes)}</small>` : ''}</div>` +
      `<span class="num">${w.sets} × ${w.reps}</span>` +
      `<span class="num">${w.weight_kg ? nf(w.weight_kg) + ' kg' : '–'}</span>` +
      `<span class="num">${w.duration_min ? w.duration_min + ' perc' : '–'}</span>` +
      `<button class="linkbtn" data-del="${w.id}" aria-label="${esc(w.exercise)} bejegyzés törlése">Törlés</button></div>`;
  }
  $('#log').innerHTML = html;
}

async function load() {
  try {
    const [list, st, info] = await Promise.all([api('workouts'), api('stats'), api('info')]);
    render(list, st, info);
  } catch (e) { say(e.message, true); }
}

$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const p = {
    performed_on: $('#performed_on').value,
    exercise: $('#exercise').value.trim(),
    sets: parseInt($('#sets').value, 10) || 1,
    reps: parseInt($('#reps').value, 10) || 1,
    weight_kg: parseFloat($('#weight_kg').value) || 0,
    duration_min: parseInt($('#duration_min').value, 10) || 0,
    notes: $('#notes').value.trim()
  };
  $('#save').disabled = true;
  try {
    await api('workouts', { method: 'POST', body: JSON.stringify(p) });
    $('#exercise').value = ''; $('#notes').value = '';
    say('Edzés mentve.');
    await load();
  } catch (err) { say(err.message, true); }
  finally { $('#save').disabled = false; }
});

$('#log').addEventListener('click', async e => {
  const b = e.target.closest('[data-del]');
  if (!b || !confirm('Törlöd ezt a bejegyzést?')) return;
  try { await api('workouts/' + b.dataset.del, { method: 'DELETE' }); say('Bejegyzés törölve.'); await load(); }
  catch (err) { say(err.message, true); }
});

$('#performed_on').value = iso(new Date());
load();
</script>
</body>
</html>
