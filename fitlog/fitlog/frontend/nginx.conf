server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Swarm beépített DNS: a "backend" név a service virtuális IP-jére oldódik fel,
    # így a kérések az összes backend replika között oszlanak el.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
